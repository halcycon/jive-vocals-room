# StudioLive FireWire returns 15/16 as a desktop audio sink.
#
# Standalone PipeWire client (run as `pipewire -c fw-sink.conf`) that tunnels
# a stereo sink into the FFADO JACK server. studiolive-fw-sink patches its
# JACK ports to the desk's FireWire returns 15/16 and restarts this process
# when JACK restarts. Installed to ~/.config/studiolive/fw-sink.conf.
context.properties = {
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-jack-tunnel
        args = {
            jack.client-name = pipewire-fw
            jack.connect     = false
            tunnel.mode      = sink
            audio.channels   = 2
            audio.position   = [ FL FR ]
            sink.props = {
                node.name        = studiolive_fw_1516
                node.description = "StudioLive FW 15/16"
            }
        }
    }
]
