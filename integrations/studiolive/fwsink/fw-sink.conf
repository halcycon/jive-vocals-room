# StudioLive FireWire return 1 as a mono desktop audio sink.
#
# Standalone PipeWire client (run as `pipewire -c fw-sink.conf`) that tunnels
# a mono sink into the FFADO JACK server. studiolive-fw-sink patches its JACK
# port to the desk's FireWire return 1 and restarts this process when JACK
# restarts. Returns 2-16 carry a constant junk level on this desk with both
# FFADO and snd-dice, so only return 1 is used. Installed to
# ~/.config/studiolive/fw-sink.conf.
context.properties = {
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-jack-tunnel
        args = {
            jack.client-name = pipewire-fw
            jack.connect     = false
            tunnel.mode      = sink
            audio.channels   = 1
            audio.position   = [ MONO ]
            sink.props = {
                node.name        = studiolive_fw_1
                node.description = "StudioLive FW 1 (mono)"
            }
        }
    }
]
